# How verity.ai gets onto Cloud Run, for both a push and a person.
#
# This file is the single definition of a deploy. `deploy.ps1` does not
# duplicate the flags below, it submits this file, so running the script by
# hand and pushing to main do exactly the same thing. That matters because
# the previous arrangement had the deploy flags in one place and any
# automation would have had its own copy, and two copies of a deploy
# configuration drift silently until the day they matter.
#
# Why this exists at all: Vercel redeploys the frontend by itself on every
# merge, and Cloud Run did not. So every pull request touching `backend/`
# needed somebody to remember to run a script, and "the site is broken" and
# "nobody ran the script" look identical from the outside. A trigger on this
# file closes that gap. See the Cloud Build section of `final_tasks.md` for
# the one-time setup.

substitutions:
  _SERVICE: verity-ai
  _REGION: us-central1
  _RUNTIME_SA: verity-ai-run@cs-sail-2b08.iam.gserviceaccount.com
  _REPO: cloud-run-source-deploy
  # The trigger overrides this with $SHORT_SHA so every image is traceable to
  # a commit. A manual `gcloud builds submit` has no commit, hence a default.
  _TAG: manual
  _CORS_ORIGINS: 'https://verity-ai-lovat.vercel.app'
  # Vercel mints a new hostname for every push and every branch, so an origin
  # allow-list by name permits exactly one deployment and blocks the rest,
  # which the browser reports only as "Failed to fetch". Single-quoted so YAML
  # leaves the backslashes alone.
  _CORS_ORIGIN_REGEX: 'https://verity-ai[a-z0-9-]*\.vercel\.app'
  # Optional shared-secret header, empty and therefore off. It has to live in
  # the deploy config rather than being set out of band, because the deploy
  # below uses --set-env-vars, which replaces the whole environment: a value
  # applied by hand would be wiped by the next push, which is exactly the
  # class of bug this file exists to end.
  #
  # To turn it on, set _API_SECRET on the trigger and VITE_API_SECRET on the
  # Vercel build to the same value. Note that a substitution is readable by
  # anyone who can read the trigger in this shared project, and that the value
  # also ships inside the frontend bundle, so this is a speed bump against
  # crawlers and forwarded links, not authentication. If it ever needs to be
  # a real secret, move it to Secret Manager and use --set-secrets, which is
  # a separate flag and so is not wiped by --set-env-vars.
  _API_SECRET: ''

options:
  # Required when the build runs as a service account rather than the legacy
  # Cloud Build account. Without it the build fails before doing any work,
  # complaining about a logs bucket.
  logging: CLOUD_LOGGING_ONLY

# The first build installs RDKit and builds the React app from scratch. The
# 10 minute default is not enough for a cold one.
timeout: 1800s

# Note there is deliberately no top-level `images:` block. That field pushes
# after every step has finished, which is too late: the deploy step below
# needs the image to already be in the registry, and the first run of this
# file failed for exactly that reason. The push is its own step instead, so
# the ordering is visible rather than implied.

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '.'

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}'

  # Deploying by image digest rather than `--source` keeps the built artifact
  # and the deployed revision provably the same thing.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}'
      - '--region=${_REGION}'
      - '--allow-unauthenticated'
      - '--service-account=${_RUNTIME_SA}'
      # Stays at 1, and no amount of budget changes that. Problem sessions,
      # meaning the answer vault and the level-3 hint budget, live in the
      # serving process's memory. A second instance would hold its own
      # separate set, and a hint landing on the wrong one would quietly serve
      # the static template instead. Raising this needs a shared session
      # store first.
      - '--max-instances=1'
      # One box always running, so the link works the instant anyone opens it.
      # This is the only setting here that bills while nothing is happening.
      - '--min-instances=1'
      - '--memory=2Gi'
      # One instance serves everybody, so three people writing at once means
      # overlapping transcription, judging and hint generation in a single
      # process. The model calls are just waiting, but RDKit and SymPy are not.
      - '--cpu=2'
      - '--timeout=300'
      # This replaces the whole environment rather than adding to it, so every
      # variable the service needs has to be named here every time.
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},GEMINI_MODEL=gemini-2.5-flash,CORS_ORIGINS=${_CORS_ORIGINS},CORS_ORIGIN_REGEX=${_CORS_ORIGIN_REGEX},VERITY_API_SECRET=${_API_SECRET}'
